  <g font-family="Arial, sans-serif"><text x="76" y="374" font-size="13" fill="#665e54">A local-first creative production workspace for generation, editing,</text><text x="76" y="396" font-size="13" fill="#665e54">batch remake, PSD delivery and turntable previews.</text><rect x="76" y="432" width="166" height="42" fill="#181512"/><text x="94" y="458" font-size="12" fill="#f4f0e8">START CREATING  ↗</text><rect x="254" y="432" width="150" height="42" fill="none" stroke="#181512"/><text x="270" y="458" font-size="12" fill="#181512">CONFIGURE API</text><text x="76" y="510" font-size="10" letter-spacing="1.5" fill="#81786c">● BRING YOUR OWN KEY   ENCRYPTED AT REST   NO TELEMETRY</text></g>
