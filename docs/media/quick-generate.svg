<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Quick Generate synthetic screenshot</title>
  <desc id="desc">Synthetic LUK Image Workspace quick generation screen with a product preview and local settings.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6f1e8"/><stop offset="1" stop-color="#e7ddd0"/></linearGradient><linearGradient id="hero" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d77960"/><stop offset="1" stop-color="#8e4d42"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2b211b" flood-opacity=".18"/></filter></defs>
  <rect width="1440" height="900" fill="#ddd5c9"/><rect x="38" y="34" width="1364" height="832" rx="24" fill="url(#bg)" stroke="#302a25" stroke-width="2" filter="url(#shadow)"/>
  <rect x="38" y="34" width="1364" height="56" rx="24" fill="#f0ebe2"/><circle cx="72" cy="62" r="6" fill="#e7624c"/><circle cx="94" cy="62" r="6" fill="#c8beb1"/><circle cx="116" cy="62" r="6" fill="#c8beb1"/><text x="154" y="67" font-family="Arial" font-size="14" font-weight="700" letter-spacing="1.5" fill="#1c1917">LUK IMAGE WORKSPACE</text><text x="1180" y="66" font-family="Arial" font-size="11" letter-spacing="1.3" fill="#82776b">LOCAL WORKBENCH</text>
  <rect x="38" y="90" width="220" height="776" fill="#f3eee6" stroke="#d3c8bb"/><text x="68" y="132" font-family="Georgia" font-size="24" fill="#1c1917">Create</text><text x="68" y="177" font-family="Arial" font-size="12" font-weight="700" fill="#e7624c">●  QUICK GENERATE</text><text x="68" y="211" font-family="Arial" font-size="12" fill="#71685e">Detail workflow</text><text x="68" y="243" font-family="Arial" font-size="12" fill="#71685e">Batch creation</text><text x="68" y="275" font-family="Arial" font-size="12" fill="#71685e">Local tools</text><line x1="68" y1="314" x2="228" y2="314" stroke="#d3c8bb"/><text x="68" y="350" font-family="Arial" font-size="11" letter-spacing="1.2" fill="#918578">WORKSPACE</text><text x="68" y="386" font-family="Arial" font-size="12" fill="#71685e">History</text><text x="68" y="418" font-family="Arial" font-size="12" fill="#71685e">Output folder</text><text x="68" y="450" font-family="Arial" font-size="12" fill="#71685e">Settings</text><text x="68" y="814" font-family="Arial" font-size="10" letter-spacing="1" fill="#918578">NO ACCOUNT · NO TELEMETRY</text>
