  <rect x="296" y="260" width="700" height="132" rx="18" fill="#fbf8f2" stroke="#bdb0a2"/><text x="324" y="300" font-family="Arial" font-size="12" fill="#8d8176">Describe the image you want to create…</text><text x="324" y="335" font-family="Georgia" font-size="19" fill="#302823">Editorial product still life, warm terracotta light, quiet ivory studio</text><line x1="324" y1="360" x2="968" y2="360" stroke="#e2d8cc"/><text x="324" y="380" font-family="Arial" font-size="10" letter-spacing="1" fill="#a08d7e">1 REFERENCE IMAGE · 1024 × 1024 · IMAGE2 MODEL READY</text>
