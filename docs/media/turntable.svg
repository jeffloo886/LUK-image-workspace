<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Turntable Studio synthetic screenshot</title>
  <desc id="desc">Synthetic eight-angle turntable workspace with angle previews and WebM export controls.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5efe6"/><stop offset="1" stop-color="#e6c7be"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#30231d" flood-opacity=".16"/></filter></defs>
